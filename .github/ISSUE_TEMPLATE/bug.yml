name: Bug report
description: Something does not work the way the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: From `pinned -version`, or the `version` field at `/health`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker compose
        - Umbrel
        - Portainer
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - Not sure
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Reverse proxy
      description: Caddy, Nginx Proxy Manager, Traefik, the Umbrel app proxy, or none.
      placeholder: none
  - type: input
    id: client
    attributes:
      label: Browser and device
      description: Only if the problem is in the app's pages or the extension.
      placeholder: Safari on iPhone, Firefox on Linux
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, one per line.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From `docker compose logs pinned`. Remove anything private, such as your addresses.
      render: text
