name: Feature request
description: Something the app could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This app stays small. Tags, page archiving, accounts, notes and telemetry will not be added. CONTRIBUTING.md says why.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the solution. What do you do today, and where does it get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is not tags, page archiving, accounts, notes or telemetry.
          required: true
