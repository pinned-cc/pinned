# Weekly pull requests for the Go builder image, the Go modules and the
# pinned GitHub Actions, so a patched Go or library does not wait for an audit.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
