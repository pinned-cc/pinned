name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

# Read only by default; only the image job may write packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: if [ -x tools/pack-extension.sh ]; then tools/pack-extension.sh; fi
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # Fails when a known vulnerability sits in code Pinned calls, in a module
      # or in the Go standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
      # The browser extension's tests: node's own test runner, no dependencies.
      - run: node --test tools/extension.test.mjs
      # The server install script against stand-ins for docker and curl.
      - run: sh tools/setup.test.sh
      - run: CGO_ENABLED=0 go build ./cmd/pinned

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No QEMU: the Dockerfile cross compiles with GOARCH on the build platform.
      # provenance-add-gha=false: buildx would otherwise write the whole push
      # event, with the pusher's email, into the provenance, in min mode too.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: provenance-add-gha=false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pinned
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      # The version the binary reports: the tag on releases, the short commit otherwise.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A software bill of materials and the build provenance, attached
          # to the image index (docker buildx imagetools inspect).
          sbom: true
          provenance: mode=min

  # On a release tag: the SBOM of each platform and a signed provenance of the
  # image go onto the GitHub release, next to the release notes.
  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Signed with the workflow's identity, stored by GitHub; anyone can check
      # it with: gh attestation verify oci://ghcr.io/pinned-cc/pinned:<version> -R pinned-cc/pinned
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pinned
          subject-digest: ${{ needs.image.outputs.digest }}
      - name: SBOM and provenance onto the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/pinned@${{ needs.image.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE" \
              --format "{{ json (index .SBOM \"linux/$arch\").SPDX }}" > "sbom-$v-$arch.spdx.json"
            # An empty or null SBOM fails the job instead of landing on the release.
            jq -e '.spdxVersion' "sbom-$v-$arch.spdx.json" > /dev/null
          done
          cp "$BUNDLE" "pinned-$v-provenance.sigstore.json"
          # The release is made by hand right after the tag; wait for it, up to 15 minutes.
          for _ in $(seq 90); do gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            "sbom-$v-amd64.spdx.json" "sbom-$v-arm64.spdx.json" "pinned-$v-provenance.sigstore.json"
