name: ui-test

# The web front end in real browsers (tools/ui-test.mjs), in Chromium, WebKit
# and Firefox on Linux, against a fresh local instance built from this commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Playwright and the browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps "${{ matrix.engine }}"
      - name: Fresh instance
        run: |
          if [ -x tools/pack-extension.sh ]; then tools/pack-extension.sh; fi
          go build -o "$RUNNER_TEMP/pinned" ./cmd/pinned
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "UI_PASSWORD=$pw" >> "$GITHUB_ENV"
          data="$(mktemp -d)"
          DATA_DIR="$data" APP_PASSWORD="$pw" PORT=9098 "$RUNNER_TEMP/pinned" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9098/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: ui-test ${{ matrix.engine }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: node tools/ui-test.mjs http://127.0.0.1:9098 "$UI_PASSWORD" --only "${{ matrix.engine }}"
      - name: Server log
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/server.log" || true
