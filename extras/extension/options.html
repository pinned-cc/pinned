<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pinned settings</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="ui.css">
<style media="(prefers-reduced-motion: reduce)">*,*::before,*::after{transition:none!important;animation:none!important}</style>
</head>
<body class="options">
<svg class="sprite" aria-hidden="true">
<symbol id="i-close" viewBox="0 0 20 20"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></symbol>
<symbol id="i-warn" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.75"/><path d="M10 6.5v4.25M10 13.4v.1"/></symbol>
<symbol id="i-folder" viewBox="0 0 20 20"><path d="M3.5 6.25A1.75 1.75 0 0 1 5.25 4.5h2.6l1.5 1.75h5.4a1.75 1.75 0 0 1 1.75 1.75v6.75a1.75 1.75 0 0 1-1.75 1.75h-9.5A1.75 1.75 0 0 1 3.5 14.75Z"/></symbol>
<symbol id="i-inbox" viewBox="0 0 20 20"><path d="M3.5 11.25 5.4 5a1.5 1.5 0 0 1 1.44-1.06h6.32A1.5 1.5 0 0 1 14.6 5l1.9 6.25v3.25a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M3.5 11.25h3.75l1 1.75h3.5l1-1.75h3.75"/></symbol>
<symbol id="i-chev" viewBox="0 0 20 20"><path d="m8 5 5 5-5 5"/></symbol>
<symbol id="i-check" viewBox="0 0 20 20"><path d="m5.5 10.25 3 3 6-6.5"/></symbol>
</svg>
<main class="opt">
  <h1><img src="icons/icon-128.png" alt="">Pinned</h1>
  <p class="lead">Connect the extension to your Pinned server. Create a token in the app and paste it here.</p>
  <form id="form" novalidate>
    <label class="fld"><span class="sh-lbl">Address</span>
      <input class="fld-in" id="address" type="url" placeholder="https://bookmarks.example.com" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fld"><span class="sh-lbl">Token</span>
      <input class="fld-in" id="token" type="password" placeholder="tk_" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p class="note">Kept in this browser only. The extension talks to this address and nowhere else.</p>
    <div class="opt-acts">
      <button type="button" class="btn" id="test">Test</button>
      <button type="submit" class="save" id="save">Save</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite" hidden></p>
  </form>
  <section class="keys">
    <h2>Shortcut</h2>
    <p><span class="kcap">Alt</span> <span class="kcap">Shift</span> <span class="kcap">S</span> opens the save popup. Change it in the browser's extension shortcuts page.</p>
  </section>
</main>
<script src="shared.js"></script>
<script src="options.js"></script>
</body>
</html>
